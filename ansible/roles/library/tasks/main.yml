---
# ── Registry: make sure the project and the requested image version exist ──────

- name: library | ensure the Harbor project exists
  ansible.builtin.uri:
    url: "{{ library_harbor_api }}/projects"
    method: POST
    user: admin
    password: "{{ vault_harbor_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      project_name: "{{ library_harbor_project }}"
      public: false
    status_code: [201, 409]
  register: _library_project
  changed_when: _library_project.status == 201
  no_log: true

- name: library | check which image tags Harbor already holds
  ansible.builtin.uri:
    url: >-
      {{ library_harbor_api }}/projects/{{ library_harbor_project }}/repositories/{{ item }}/artifacts/{{ library_version }}
    method: GET
    user: admin
    password: "{{ vault_harbor_admin_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  register: _library_artifacts
  loop: "{{ library_components }}"
  no_log: true
  # uri does not support check mode and would be skipped, leaving no `status` for the
  # build decision below. This is a read-only GET, so a dry run can safely perform it.
  check_mode: false

- name: library | decide whether an image build is needed
  ansible.builtin.set_fact:
    # `| bool` matters: -e library_force_build=true arrives as the string "true", and a
    # conditional that evaluates to a string is an error under strict conditionals.
    _library_build_needed: >-
      {{ (library_force_build | bool)
         or (_library_artifacts.results | selectattr('status', 'equalto', 404) | list | length > 0) }}

- name: library | report the build decision
  ansible.builtin.debug:
    msg: >-
      {{ 'Building library ' ~ library_version ~ ' — not present in Harbor (or forced).'
         if (_library_build_needed | bool)
         else 'library ' ~ library_version ~ ' already in Harbor, skipping build.' }}

# ── Build: ship the source to the Mini PC and build there ─────────────────────
# Building on the target keeps the images native amd64 (no cross-arch emulation from
# an Apple Silicon control machine) and keeps every step inside Ansible.

- name: library | build and publish images
  when: _library_build_needed | bool
  block:
    - name: library | assert the source directory exists on the control machine
      ansible.builtin.stat:
        path: "{{ library_source_dir }}/library-backend/pyproject.toml"
      delegate_to: localhost
      become: false
      register: _library_src

    - name: library | fail early when the source is missing
      ansible.builtin.fail:
        msg: >-
          library source not found at {{ library_source_dir }}. Clone
          github.com/PhilippTheServer/library next to this repo, or set
          library_source_dir.
      when: not _library_src.stat.exists

    - name: library | refuse to publish a tag the source does not declare
      ansible.builtin.assert:
        that: _library_source_version == library_version
        fail_msg: >-
          library_version is {{ library_version }}, but the source at
          {{ library_source_dir }} declares '{{ _library_source_version }}' in
          library-backend/pyproject.toml. Release that version in library first, or
          check out the commit that declares it.
        quiet: true
      vars:
        _library_source_version: >-
          {{ lookup('ansible.builtin.file', library_source_dir ~ '/library-backend/pyproject.toml')
             | regex_search('(?m)^version = "[^"]+"')
             | default('', true)
             | regex_replace('^version = "|"$', '') }}

    - name: library | package the source
      ansible.builtin.command:
        cmd: >-
          tar --exclude=.git --exclude=node_modules --exclude=.venv --exclude=dist
              --exclude=.angular --exclude=__pycache__ --exclude=.env --exclude=._*
              --exclude=out-tsc
              -czf {{ _library_tarball }} -C {{ library_source_dir }} .
      delegate_to: localhost
      become: false
      changed_when: true
      vars:
        _library_tarball: "/tmp/library-{{ library_version }}.tar.gz"
      environment:
        # macOS ships BSD tar, which stores extended attributes as AppleDouble "._name"
        # sidecar files. See the same note in the harbor_image role.
        COPYFILE_DISABLE: "1"

    - name: library | start from a clean build directory
      # unarchive overwrites but never deletes, so files dropped from the source tree
      # would linger between builds.
      ansible.builtin.file:
        path: "{{ library_build_dir }}"
        state: absent

    - name: library | create the build directory
      ansible.builtin.file:
        path: "{{ library_build_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0750'

    - name: library | upload and unpack the source
      ansible.builtin.unarchive:
        src: "/tmp/library-{{ library_version }}.tar.gz"
        dest: "{{ library_build_dir }}"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
      # The tarball only exists once the package step has run, which check mode skips.
      when: not ansible_check_mode

    - name: library | log in to Harbor
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          printf '%s' '{{ vault_harbor_admin_password }}' |
          docker login {{ library_registry }} --username admin --password-stdin
        executable: /bin/bash
      become_user: "{{ deploy_user }}"
      changed_when: false
      no_log: true

    - name: library | build the images
      ansible.builtin.command:
        cmd: >-
          docker build --pull
            -t {{ library_registry }}/{{ library_harbor_project }}/{{ item }}:{{ library_version }}
            -t {{ library_registry }}/{{ library_harbor_project }}/{{ item }}:latest
            {{ library_build_dir }}/library-{{ item }}
      become_user: "{{ deploy_user }}"
      changed_when: true
      loop: "{{ library_components }}"
      loop_control:
        label: "library-{{ item }}"

    - name: library | push the images
      ansible.builtin.command:
        cmd: "docker push {{ library_registry }}/{{ library_harbor_project }}/{{ item.0 }}:{{ item.1 }}"
      become_user: "{{ deploy_user }}"
      changed_when: true
      loop: "{{ library_components | product([library_version, 'latest']) | list }}"
      loop_control:
        label: "{{ item.0 }}:{{ item.1 }}"

    - name: library | remove the uploaded source tarball
      ansible.builtin.file:
        path: "/tmp/library-{{ library_version }}.tar.gz"
        state: absent
      delegate_to: localhost
      become: false

# The deploy user needs credentials for `docker compose pull` even when nothing was
# built — for example on a fresh host pulling an image that is already in Harbor.
- name: library | ensure the deploy user is logged in to Harbor
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      printf '%s' '{{ vault_harbor_admin_password }}' |
      docker login {{ library_registry }} --username admin --password-stdin
    executable: /bin/bash
  become_user: "{{ deploy_user }}"
  changed_when: false
  no_log: true

# ── Metrics ───────────────────────────────────────────────────────────────────
# Miniflux answers /metrics only for the networks it is told to trust. Prometheus
# reaches it over `proxy`, so read that network's real subnet rather than hardcoding
# one that a `docker network` recreation would silently invalidate.

- name: library | read the proxy network's subnet
  ansible.builtin.command:
    cmd: docker network inspect proxy --format '{{ '{{' }} (index .IPAM.Config 0).Subnet {{ '}}' }}'
  register: _library_proxy_subnet
  changed_when: false
  check_mode: false

- name: library | trust the proxy network for the metrics endpoint
  ansible.builtin.set_fact:
    library_metrics_allowed_networks: "{{ _library_proxy_subnet.stdout | trim }}"

- name: library | fail when the proxy subnet could not be read
  ansible.builtin.assert:
    that: library_metrics_allowed_networks is match('^[0-9]+[0-9.]*/[0-9]+$')
    fail_msg: >-
      Could not read a CIDR for the `proxy` Docker network (got
      '{{ library_metrics_allowed_networks }}'). Miniflux would answer /metrics with a
      403 and the Grafana target would show as down.
    quiet: true

# ── Deploy ────────────────────────────────────────────────────────────────────

- name: library | deploy the compose stack
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_service: library
    # Miniflux crash-loops if its migrations fail; without waiting the play would
    # still report success.
    compose_wait: true
